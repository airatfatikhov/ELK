x-es-base: &es-base
 image: elasticsearch:7.17.6
 user: "1000:1000"

services:
 # -------------------------------------------------------
 # Master-узлы: только master role, не хранят данные
 # -------------------------------------------------------
  es-master-1:
    <<: *es-base
    hostname: '{{.Node.Hostname}}'
    environment:
      - node.name=elk_es-master-1
      - cluster.name=elk-stage
      - node.roles=master,remote_cluster_client
      - network.host=0.0.0.0
      - discovery.seed_hosts=elk_es-master-2,elk_es-master-3
      - cluster.initial_master_nodes=elk_es-master-1,elk_es-master-2,elk_es-master-3
      - xpack.security.enabled=false
      - xpack.monitoring.collection.enabled=true
      - "ES_JAVA_OPTS=-Xms4g -Xmx4g"
      - TZ=Europe/Moscow
    volumes:
      - /mnt/es-master-1/data:/usr/share/elasticsearch/data
      - /etc/localtime:/etc/localtime
    networks:
      - docker_swarm_elk
    deploy:
      replicas: 1
      placement:
        constraints:
          - "node.hostname == hostname"
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.master-1.rule=Host(`master-1.elk-stage.test`)"
      - "traefik.http.routers.master-1.entrypoints=websecure"
      - "traefik.http.routers.master-1.tls=true"
      - "traefik.http.services.master-1.loadbalancer.server.port=9200"
 #Settings Timeout
  # - "traefik.http.serversTransport.master-1.forwardingTimeouts.dialTimeout=30s"
  # - "traefik.http.serversTransport.master-1.forwardingTimeouts.responseHeaderTimeout=0s"
  # - "traefik.http.serversTransport.master-1.forwardingTimeouts.idleConnTimeout=90s"

