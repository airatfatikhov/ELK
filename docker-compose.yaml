x-es-base: &es-base
  image: docker.elastic.co/elasticsearch/elasticsearch:7.17.6
  restart: unless-stopped
  networks:
    - docker_swarm_elk
  healthcheck:
    test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -q cluster_name"]
    interval: 10s
    timeout: 5s
    retries: 30
    start_period: 30s

services:
  # -------------------------------------------------------
  # Master-узлы: только master role, не хранят данные
  # -------------------------------------------------------
  es-master-1:
    <<: *es-base
    container_name: es-master-1
    environment:
      - node.name=es-master-1
      - cluster.name=elk-stage
      - node.roles=master
      - network.host=0.0.0.0
      - discovery.seed_hosts=es-master-2,es-master-3
      - cluster.initial_master_nodes=es-master-1,es-master-2,es-master-3
      - bootstrap.memory_lock=false
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - /mnt/es-master-1/data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    deploy:
      replicas: 1
      placement:
        constraints:
          - "node.hostname == servername"

  es-master-2:
    <<: *es-base
    container_name: es-master-2
    environment:
      - node.name=es-master-2
      - cluster.name=elk-demo
      - node.roles=master
      - network.host=0.0.0.0
      - discovery.seed_hosts=es-master-1,es-master-3
      - cluster.initial_master_nodes=es-master-1,es-master-2,es-master-3
      - bootstrap.memory_lock=false
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - /mnt/es-master-2/data:/usr/share/elasticsearch/data
    deploy:
      replicas: 1
      placement:
        constraints:
          - "node.hostname == servername"

  es-master-3:
    <<: *es-base
    container_name: es-master-3
    environment:
      - node.name=es-master-3
      - cluster.name=elk-demo
      - node.roles=master
      - network.host=0.0.0.0
      - discovery.seed_hosts=es-master-1,es-master-2
      - cluster.initial_master_nodes=es-master-1,es-master-2,es-master-3
      - bootstrap.memory_lock=false
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - /mnt/es-master-3/data:/usr/share/elasticsearch/data
    deploy:
      replicas: 1
      placement:
        constraints:
          - "node.hostname == servername"

  # -------------------------------------------------------
  # Data-узлы: хранят данные и могут выполнять ingest
  # -------------------------------------------------------
  es-data-1:
    <<: *es-base
    container_name: es-data-1
    environment:
      - node.name=es-data-1
      - cluster.name=elk-demo
      - node.roles=data,ingest
      - network.host=0.0.0.0
      - discovery.seed_hosts=es-master-1,es-master-2,es-master-3
      - bootstrap.memory_lock=false
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - /mnt/es-data-1/data:/usr/share/elasticsearch/data
    deploy:
      replicas: 1
      placement:
        constraints:
          - "node.hostname == servername"
    depends_on:
      es-master-1:
        condition: service_healthy
      es-master-2:
        condition: service_healthy
      es-master-3:
        condition: service_healthy

  es-data-2:
    <<: *es-base
    container_name: es-data-2
    environment:
      - node.name=es-data-2
      - cluster.name=elk-demo
      - node.roles=data,ingest
      - network.host=0.0.0.0
      - discovery.seed_hosts=es-master-1,es-master-2,es-master-3
      - bootstrap.memory_lock=false
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - /mnt/es-data-2/data:/usr/share/elasticsearch/data
    deploy:
      replicas: 1
      placement:
        constraints:
          - "node.hostname == servername"
    depends_on:
      es-master-1:
        condition: service_healthy
      es-master-2:
        condition: service_healthy
      es-master-3:
        condition: service_healthy

  es-data-3:
    <<: *es-base
    container_name: es-data-3
    environment:
      - node.name=es-data-3
      - cluster.name=elk-demo
      - node.roles=data,ingest
      - network.host=0.0.0.0
      - discovery.seed_hosts=es-master-1,es-master-2,es-master-3
      - bootstrap.memory_lock=false
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - /mnt/es-data-3/data:/usr/share/elasticsearch/data
    deploy:
      replicas: 1
      placement:
        constraints:
          - "node.hostname == servername"
    depends_on:
      es-master-1:
        condition: service_healthy
      es-master-2:
        condition: service_healthy
      es-master-3:
        condition: service_healthy

  # -------------------------------------------------------
  # Logstash
  # -------------------------------------------------------
  logstash:
    image: docker.elastic.co/logstash/logstash:7.17.6
    container_name: logstash
    restart: unless-stopped
    networks:
      - docker_swarm_elk
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - "5044:5044"   # Beats input
      - "5000:5000"   # TCP JSON input для теста
      - "9600:9600"   # Logstash monitoring API
    deploy:
      replicas: 1
      placement:
        constraints:
          - "node.hostname == servername"
    depends_on:
      es-data-1:
        condition: service_healthy
      es-data-2:
        condition: service_healthy
      es-data-3:
        condition: service_healthy

  # -------------------------------------------------------
  # Kibana
  # -------------------------------------------------------
  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.6
    container_name: kibana
    restart: unless-stopped
    networks:
      - docker_swarm_elk
    environment:
      SERVER_HOST: "0.0.0.0"
      ELASTICSEARCH_HOSTS: '["http://es-master-1:9200","http://es-master-2:9200","http://es-master-3:9200"]'
      XPACK_SECURITY_ENABLED: "false"
    ports:
      - "5601:5601"
    deploy:
      replicas: 1
      placement:
        constraints:
          - "node.hostname == servername"
    depends_on:
      es-master-1:
        condition: service_healthy
      es-master-2:
        condition: service_healthy
      es-master-3:
        condition: service_healthy

networks:
  docker_swarm_elk:
    external: true