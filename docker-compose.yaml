 # -------------------------------------------------------
 # Logstash
 # -------------------------------------------------------
  logstash:
    image: logstash:7.17.6
    hostname: '{{.Node.Hostname}}'
    user: "1000:1000"
    networks:
      - docker_swarm_elk
    environment:
      - "LS_JAVA_OPTS=-Xms2g -Xmx2g"
      - TZ=Europe/Moscow
    volumes:
      - /mnt/logstash/config/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - /mnt/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - /mnt/logstash/config/logstash-sample.conf:/usr/share/logstash/config/logstash-sample.conf:ro
      - /mnt/logstash/certs/elk-stage.crt:/usr/share/logstash/certs/elk-stage.crt:ro
      - /mnt/logstash/certs/elk-stage.crt:/etc/logstash/certs/elk-stage.crt
      - /etc/localtime:/etc/localtime
# ports:
# - "5044:5044" # Beats input
# - "5000:5000" # TCP JSON input для теста
# - "9600:9600" # Logstash monitoring API
    deploy:
      replicas: 1
      placement:
        constraints:
          - "node.hostname == hostname"
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.logstash-beats.rule=Host(`logstash-beats.elk-stage.test`)"
        - "traefik.http.routers.logstash-beats.entrypoints=websecure"
        - "traefik.http.routers.logstash-beats.tls=true"
        - "traefik.http.services.logstash-beats.loadbalancer.server.port=5044"

 # -------------------------------------------------------
 # Kibana
 # -------------------------------------------------------
  kibana:
   image: kibana:7.17.6
   hostname: '{{.Node.Hostname}}'
   networks:
     - docker_swarm_elk
   environment:
     SERVER_HOST: "0.0.0.0"
     XPACK_SECURITY_ENABLED: "false"
     TZ: "Europe/Moscow"
   volumes:
     - /mnt/kibana/certs/elk-stage.crt:/usr/share/kibana/config/certs/elk-stage.crt
     - /mnt/kibana/config/kibana.yml:/usr/share/kibana/config/kibana.yml
     - /etc/localtime:/etc/localtime
   deploy:
     replicas: 1
     placement:
       constraints:
         - "node.hostname == hostname"
     restart_policy:
       condition: on-failure
       delay: 10s
       max_attempts: 3
       window: 120s
   labels:
     - "traefik.enable=true"
     - "traefik.http.routers.kibana.rule=Host(`kibana.elk-stage.test`)"
     - "traefik.http.routers.kibana.entrypoints=websecure"
     - "traefik.http.routers.kibana.tls=true"
     - "traefik.http.services.kibana.loadbalancer.server.port=5601"

networks:
 docker_swarm_elk:
 external: true